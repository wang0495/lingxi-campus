name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python3.10/site-packages
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
        continue-on-error: false

      - name: 运行 Ruff 代码检查
        id: ruff
        run: |
          echo "::group::Ruff 检查结果"
          ruff check . --output-format=github || echo "::error::Ruff 检查失败，请查看上方详细信息"
          echo "::endgroup::"
        continue-on-error: false

      - name: 运行 MyPy 类型检查
        id: mypy
        run: |
          echo "::group::MyPy 类型检查结果"
          mypy lingxi_qwenpaw tests --show-error-codes --pretty || echo "::error::MyPy 类型检查失败，请查看上方详细信息"
          echo "::endgroup::"
        continue-on-error: false

      - name: 运行 Pytest 测试
        id: pytest
        run: |
          echo "::group::Pytest 测试结果"
          pytest tests/ -v --tb=long --cov=lingxi_qwenpaw --cov-report=xml --cov-report=term-missing || echo "::error::测试失败，请查看上方详细信息"
          echo "::endgroup::"
        continue-on-error: false

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 生成作业摘要
        if: always()
        run: |
          echo "## CI 检查结果摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff 代码检查 | ${{ steps.ruff.outcome == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MyPy 类型检查 | ${{ steps.mypy.outcome == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pytest 测试 | ${{ steps.pytest.outcome == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY

      - name: 检查所有步骤是否成功
        if: always()
        run: |
          if [[ "${{ steps.ruff.outcome }}" != "success" || "${{ steps.mypy.outcome }}" != "success" || "${{ steps.pytest.outcome }}" != "success" ]]; then
            echo "::error::CI 检查失败，请查看上方详细错误信息"
            exit 1
          fi
          echo "✅ 所有 CI 检查通过！"
